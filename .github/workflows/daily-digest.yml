name: Daily Tech Digest

on:
  schedule:
    # 매일 07:50 KST (= 22:50 UTC). GitHub cron은 수 분~수십 분 늦게 돌 수 있어요.
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송하지 않고 미리보기만"
        type: boolean
        default: false

permissions:
  contents: write   # state/seen.json 커밋용

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build & send digest
        env:
          SLACK_WEBHOOK_URLS: ${{ secrets.SLACK_WEBHOOK_URLS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # 한국어 번역 (무료 티어)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 선택(유료). 있으면 Gemini 대신 사용
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python digest.py --dry-run
          else
            python digest.py
          fi

      - name: Save sent-history
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "chore: update sent history [skip ci]"
          git push
